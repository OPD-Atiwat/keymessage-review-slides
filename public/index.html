<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ผลโฆษณารายเล่ม</title>
  <link rel="stylesheet" href="/styles.css?v=20261109t114">
</head>
<body class="mode-web">
  <div id="boot-error" hidden></div>
  <header id="webnav">
    <div class="brand"><span class="logo-dot" aria-hidden="true"></span><strong>ผลโฆษณารายเล่ม</strong></div>
    <nav>
      <button type="button" data-view="overview" class="on" aria-pressed="true" aria-current="page">ภาพรวม</button>
      <button type="button" data-view="book" aria-pressed="false">รายเล่ม</button>
      <button type="button" data-view="creator" aria-pressed="false">Creator</button>
      <button type="button" data-view="analysis" aria-pressed="false">วิเคราะห์ต่อยอด</button>
    </nav>
    <label class="range-chip">ช่วง
      <select id="report-period" class="is-current" aria-label="ผลลัพธ์ช่วง">
        <option value="nov1_8" selected>1–8 พ.ย. 2569</option>
        <option value="oct">ต.ค. 2569</option>
        <option value="sep">ก.ย. 2569</option>
        <option value="aug">ส.ค. 2569</option>
        <option value="jul">ก.ค. 2569</option>
        <option value="jun">มิ.ย. 2569</option>
        <option value="may">พ.ค. 2569</option>
      </select>
      <span id="asof" class="asof">ถึง 8 พ.ย. 2569</span>
    </label>
  </header>
  <section id="web-panel">
    <div id="web-stage">
      <div id="web-main"></div>
    </div>
  </section>
  <dialog id="zoom" aria-labelledby="detail-name">
    <form method="dialog">
      <span id="detail-strip" class="detail-strip"></span>
      <button class="detail-close" type="submit" value="cancel" aria-label="ปิด">✕</button>
      <h2 id="detail-name"></h2>
      <p id="detail-meta"></p>
      <div id="detail-metrics"></div>
      <p id="detail-source"></p>
      <p id="detail-note"></p>
    </form>
  </dialog>
  <script src="/boot.js?v=20261109t114"></script>
  <script type="module" src="/app.js?v=20261109t114"></script>
</body>
</html>
