services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keymessage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keymessage
    volumes:
      - kmdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keymessage -d keymessage"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://keymessage:${POSTGRES_PASSWORD}@db:5432/keymessage
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      EDITOR_PASSWORD_HASH: ${EDITOR_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  kmdata:
